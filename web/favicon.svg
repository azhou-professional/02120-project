<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Page icon: a low-poly satellite like the GPS III model in satmodels.js (cube body, two solar wings
       on booms, antenna on the Earth face), white with flat grey facets, on the page's dark background. -->
  <rect width="32" height="32" fill="#0f1419"/>
  <g stroke="#ffffff" stroke-width="1" stroke-linecap="square">
    <line x1="20" y1="15.5" x2="22" y2="14.5"/>   <!-- booms -->
    <line x1="12" y1="16.5" x2="10" y2="17.5"/>
    <line x1="16" y1="20.5" x2="16" y2="23"/>     <!-- antenna -->
  </g>
  <!-- right wing: two panels, each two triangles in slightly different shades -->
  <polygon points="22,11 26,9 26,16 22,18" fill="#eef1f4"/>
  <polygon points="22,11 26,16 22,18" fill="#d3d9e0"/>
  <polygon points="26.5,8.75 30,7 30,14 26.5,15.75" fill="#eef1f4"/>
  <polygon points="26.5,8.75 30,14 26.5,15.75" fill="#d3d9e0"/>
  <!-- left wing -->
  <polygon points="10,14 6,16 6,23 10,21" fill="#eef1f4"/>
  <polygon points="10,14 6,23 10,21" fill="#d3d9e0"/>
  <polygon points="5.5,16.25 2,18 2,25 5.5,23.25" fill="#eef1f4"/>
  <polygon points="5.5,16.25 2,25 5.5,23.25" fill="#d3d9e0"/>
  <!-- body: a cube seen from above, three faces in three shades -->
  <polygon points="16,11.5 20,13.5 16,15.5 12,13.5" fill="#ffffff"/>
  <polygon points="12,13.5 16,15.5 16,20.5 12,18.5" fill="#dde2e8"/>
  <polygon points="16,15.5 20,13.5 20,18.5 16,20.5" fill="#bcc4ce"/>
</svg>
